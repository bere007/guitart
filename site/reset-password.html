<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новый пароль — GuitArt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  .reset-main{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 73px);padding:40px 24px}
  .reset-box{width:100%;max-width:400px}
  .state-panel{display:none;text-align:center;padding:20px 0}
  .state-panel.is-active{display:block}
</style>
</head>
<body>

<header id="site-nav" class="site-nav"></header>

<main class="reset-main">
  <div class="reset-box">
    <span class="eyebrow">Новый пароль</span>
    <h1 style="font-size:1.7rem;margin-top:10px">Задай новый пароль</h1>

    <form id="reset-form" style="margin-top:24px">
      <div class="field">
        <label for="new-pass">Новый пароль</label>
        <input type="password" id="new-pass" placeholder="Минимум 6 символов" required minlength="6">
      </div>
      <p class="error-text" id="reset-error">Не получилось изменить пароль.</p>
      <button type="submit" class="btn btn-pedal btn-block" id="reset-submit">Сохранить пароль</button>
    </form>

    <div class="state-panel" id="panel-invalid">
      <p class="muted">Ссылка недействительна или устарела — запроси новую на странице входа.</p>
      <a href="auth.html?mode=login" class="btn btn-ghost" style="margin-top:18px">К входу</a>
    </div>

    <div class="state-panel" id="panel-done">
      <p class="muted">Пароль обновлён.</p>
      <a href="course.html" class="btn btn-pedal" style="margin-top:18px">В личный кабинет</a>
    </div>
  </div>
</main>

<script type="module">
import { supabase, whoAmI } from './app.js';

const form = document.getElementById('reset-form');
const invalidPanel = document.getElementById('panel-invalid');
const donePanel = document.getElementById('panel-done');

// The reset-password email link logs the browser into a short-lived
// "recovery" session automatically (supabase-js parses it from the URL
// before getSession() below resolves). If there's still no session, the
// link was invalid, already used, or expired.
(async () => {
  const user = await whoAmI();
  if(!user){
    form.hidden = true;
    invalidPanel.classList.add('is-active');
  }
})();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pass = document.getElementById('new-pass').value;
  const err = document.getElementById('reset-error');
  const btn = document.getElementById('reset-submit');
  btn.disabled = true; btn.textContent = 'Сохраняем…';
  const { error } = await supabase.auth.updateUser({ password: pass });
  btn.disabled = false; btn.textContent = 'Сохранить пароль';
  if(error){
    err.textContent = 'Не получилось изменить пароль: ' + error.message;
    err.classList.add('show');
    return;
  }
  form.hidden = true;
  donePanel.classList.add('is-active');
});
</script>
</body>
</html>
