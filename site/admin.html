<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — GuitArt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap{padding:44px 0 90px}
  .roster{margin-top:28px;border-radius:16px;overflow:hidden}
  .roster-row{display:grid;grid-template-columns:1.4fr .9fr .9fr 1fr 1.2fr;gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--line)}
  .roster-row.head{font-family:'Space Mono';font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);border-top:none}
  .roster-row:nth-of-type(2){border-top:none}
  @media (max-width:820px){ .roster-row{grid-template-columns:1fr 1fr;gap:8px} .roster-row.head{display:none} }
  .r-name{font-weight:700}
  .r-mini{font-family:'Space Mono';font-size:.72rem;color:var(--ink-faint)}
  .denied{padding:60px 20px;text-align:center}
</style>
</head>
<body>

<header id="site-nav" class="site-nav"></header>

<main class="wrap admin-wrap">
  <div id="denied" class="card denied" hidden>
    <h3 style="font-size:1.2rem">Доступ только для преподавателей</h3>
    <p class="muted" style="margin-top:10px">Этот аккаунт не отмечен как admin. Попроси владельца проекта выдать доступ в Supabase (см. README).</p>
    <a href="course.html" class="btn btn-ghost" style="margin-top:20px">В личный кабинет</a>
  </div>

  <div id="roster-wrap" hidden>
    <span class="eyebrow">Преподавательская</span>
    <h1 style="font-size:clamp(1.6rem,3vw,2.1rem);margin-top:10px">Ученики и их прогресс</h1>
    <p class="muted" style="margin-top:8px">Отмечай сдачу экзамена здесь — сертификат появится в личном кабинете ученика автоматически.</p>

    <div class="card roster" id="roster"></div>
  </div>
</main>

<script type="module">
import { requireAuth, currentProfile, fetchAdminRoster, markExamPassed, escapeHtml, CURRICULUM } from './app.js';

(async () => {
  const user = await requireAuth();
  if(!user) return;

  if(!currentProfile()?.is_admin){
    document.getElementById('denied').hidden = false;
    return;
  }
  document.getElementById('roster-wrap').hidden = false;

  async function render(){
    const roster = await fetchAdminRoster();
    const el = document.getElementById('roster');
    el.innerHTML = `
      <div class="roster-row head">
        <span>Ученик</span><span>Прогресс</span><span>Оплата</span><span>Экзамен</span><span></span>
      </div>
      ${roster.map(u => {
        const examLabel = u.exam.passed ? 'сдан ✓' : (u.exam.slot ? 'записан: ' + escapeHtml(u.exam.slot) : 'не записан');
        const canMark = u.paid && u.reportsDone >= CURRICULUM.length && u.exam.slot && !u.exam.passed;
        return `
        <div class="roster-row">
          <span><span class="r-name">${escapeHtml(u.name)}</span><br><span class="r-mini">@${escapeHtml(u.nickname || '—')}</span></span>
          <span class="r-mini">${u.reportsDone} / ${CURRICULUM.length} отчётов</span>
          <span class="r-mini">${u.paid ? 'оплачен' : 'не оплачен'}</span>
          <span class="r-mini">${examLabel}</span>
          <span>${canMark ? `<button type="button" class="btn btn-pedal btn-sm" data-mark="${u.id}" data-name="${escapeHtml(u.name)}">Отметить сдано</button>` : ''}</span>
        </div>`;
      }).join('') || '<div class="roster-row"><span class="faint">Пока нет учеников.</span></div>'}
    `;

    el.querySelectorAll('[data-mark]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true; btn.textContent = 'Сохраняем…';
        const error = await markExamPassed(btn.dataset.mark, btn.dataset.name);
        if(error){ alert('Не получилось: ' + error.message); }
        render();
      });
    });
  }

  render();
})();
</script>
</body>
</html>
